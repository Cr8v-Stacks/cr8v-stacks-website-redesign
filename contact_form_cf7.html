<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form 7 — Visual Preview — Cr8v Stacks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c8cf-ink: #080808; 
      --c8cf-gray: #8A8A8A; 
      --c8cf-line: rgba(8,8,8,.2);
      --c8cf-blue: #0047E1; 
      --c8cf-blue-mid: #0038C0; 
      --c8cf-red: #C4291F;
      font-family: 'DM Sans', sans-serif;
    }
    body {
      background: #080808;
      padding: 3rem 1rem;
      display: flex;
      justify-content: center;
    }
    .preview-card {
      background: #F2F1EC;
      padding: 3rem;
      border-radius: 4px;
      max-width: 680px;
      width: 100%;
      box-sizing: border-box;
    }
    .preview-title {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c8cf-blue);
      margin-bottom: 1.5rem;
    }

    /* ── CF7 Styles ── */
    .c8cf-root *, .c8cf-root *::before, .c8cf-root *::after { box-sizing: border-box !important; }
    .c8cf-row { display: flex; gap: 1.75rem; }
    .c8cf-field { margin-bottom: 1.75rem; flex: 1; }
    .c8cf-flabel { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--c8cf-gray); margin-bottom: 8px; display: block; }
    .c8cf-root input.c8cf-input, .c8cf-root textarea.c8cf-textarea {
      width: 100%; background: transparent; border: none; border-bottom: 1.5px solid var(--c8cf-line); color: var(--c8cf-ink); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 8px 2px; outline: none; transition: border-color .2s;
    }
    .c8cf-root textarea.c8cf-textarea { min-height: 88px; resize: vertical; }
    .c8cf-root input:focus, .c8cf-root textarea:focus { border-color: var(--c8cf-blue); }

    /* Services Pills */
    .c8cf-services { display: flex !important; flex-wrap: wrap !important; gap: 8px !important; }
    .c8cf-services .wpcf7-list-item {
      display: inline-flex !important; align-items: center !important; position: relative !important; cursor: pointer !important; border: 1px solid var(--c8cf-line) !important; background: transparent !important; padding: 9px 14px !important; font-size: 13px !important; color: var(--c8cf-ink) !important; transition: all .2s !important; user-select: none !important; margin: 0 !important; border-radius: 4px;
    }
    .c8cf-services .wpcf7-list-item input[type="checkbox"] { position: absolute !important; inset: 0 !important; opacity: 0 !important; cursor: pointer !important; z-index: 2 !important; }
    .c8cf-services .wpcf7-list-item.is-checked { background: var(--c8cf-ink) !important; border-color: var(--c8cf-ink) !important; color: #fff !important; }
    
    .c8cf-submit-row { margin-top: .5rem; }
    .c8cf-root input.c8cf-submit { width: 100%; height: 54px; background: var(--c8cf-ink); border: 1px solid var(--c8cf-ink); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: background .2s; border-radius: 4px; }
    .c8cf-root input.c8cf-submit:hover { background: var(--c8cf-blue); border-color: var(--c8cf-blue); }

    @media (max-width: 480px) { .c8cf-row { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>

<div class="preview-card">
  <div class="preview-title">CF7 Form Structure — Visual Preview</div>

  <div class="c8cf-root">
    <div class="c8cf-row">
      <div class="c8cf-field">
        <span class="c8cf-flabel">Full Name</span>
        <input type="text" name="your-Name" class="c8cf-input" placeholder="Alex Morgan">
      </div>
      <div class="c8cf-field">
        <span class="c8cf-flabel">Email</span>
        <input type="email" name="Your-Email" class="c8cf-input" placeholder="alex@company.com">
      </div>
    </div>
    <div class="c8cf-field">
      <span class="c8cf-flabel">Phone (optional)</span>
      <input type="tel" name="Phone-Number" class="c8cf-input" placeholder="+234 705 496 3639">
    </div>
    <div class="c8cf-field">
      <span class="c8cf-flabel">What do you need help with? — pick at least one</span>
      <div class="c8cf-services">
        <label class="wpcf7-list-item is-checked"><input type="checkbox" checked>Website Design &amp; Development</label>
        <label class="wpcf7-list-item"><input type="checkbox">WordPress / Elementor Development</label>
        <label class="wpcf7-list-item"><input type="checkbox">UI/UX Design</label>
        <label class="wpcf7-list-item"><input type="checkbox">SEO &amp; Content Strategy</label>
        <label class="wpcf7-list-item"><input type="checkbox">Digital Marketing</label>
        <label class="wpcf7-list-item"><input type="checkbox">Something Else</label>
      </div>
    </div>
    <div class="c8cf-field">
      <span class="c8cf-flabel">Message (optional — elaborate here if "Something Else")</span>
      <textarea name="Your-Message" class="c8cf-textarea" placeholder="Tell us about your project goals, scope, and timeline..."></textarea>
    </div>
    <div class="c8cf-submit-row">
      <input type="submit" value="SEND MESSAGE →" class="c8cf-submit">
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.wpcf7-list-item input').forEach(cb => {
  cb.addEventListener('change', e => {
    e.target.parentElement.classList.toggle('is-checked', e.target.checked);
  });
});
</script>

</body>
</html>
