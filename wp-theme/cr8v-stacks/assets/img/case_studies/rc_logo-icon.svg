<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
	<!-- Background rounded frame -->
	<rect width="64" height="64" rx="14" fill="#0D050B"/>
	<rect x="1" y="1" width="62" height="62" rx="13" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.4"/>
	
	<!-- Red Cap & Feather -->
	<g transform="translate(8, 8)">
		<!-- Drop shadow -->
		<ellipse cx="24" cy="42" rx="20" ry="3.5" fill="#C81E3A" opacity="0.3"/>
		
		<!-- Red Cap Body -->
		<path d="M8 38 C8 24 14 16 24 16 C34 16 40 24 40 38 C40 40 38 42 24 42 C10 42 8 40 8 38 Z" fill="url(#rceIconCap)" stroke="#9B1B30" stroke-width="1"/>
		
		<!-- Traditional Chevron Pattern -->
		<path d="M12 30 L16 34 L20 30 L24 34 L28 30 L32 34 L36 30" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
		<path d="M12 35 L16 39 L20 35 L24 39 L28 35 L32 39 L36 35" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
		
		<!-- Gold Trim Rim -->
		<path d="M8 38 C8 35 14 34 24 34 C34 34 40 35 40 38 C40 41 34 43 24 43 C14 43 8 41 8 38 Z" fill="url(#rceIconGold)" stroke="#B8860B" stroke-width="0.8"/>
		
		<!-- Golden Eagle Feather (Abuba Ugo) -->
		<path d="M17 38 C17 31 13 20 22 5 C25 14 31 18 26 29 C23 33 20 37 17 38 Z" fill="url(#rceIconFeather)" stroke="#D4AF37" stroke-width="0.9"/>
		<path d="M17 38 C18 29 20 18 22 5" stroke="#996515" stroke-width="1" stroke-linecap="round"/>
		<path d="M19 18 L15 16 M20 22 L16 21 M21 27 L17 26 M23 15 L26 13 M23 20 L27 18 M23 25 L26 24" stroke="#FFF8DC" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
	</g>

	<defs>
		<linearGradient id="rceIconCap" x1="8" y1="16" x2="40" y2="42" gradientUnits="userSpaceOnUse">
			<stop stop-color="#E61E43"/>
			<stop offset="0.6" stop-color="#C81E3A"/>
			<stop offset="1" stop-color="#8B0018"/>
		</linearGradient>
		<linearGradient id="rceIconGold" x1="8" y1="34" x2="40" y2="43" gradientUnits="userSpaceOnUse">
			<stop stop-color="#FDF0CD"/>
			<stop offset="0.4" stop-color="#E8B62C"/>
			<stop offset="0.8" stop-color="#D4AF37"/>
			<stop offset="1" stop-color="#AA771C"/>
		</linearGradient>
		<linearGradient id="rceIconFeather" x1="13" y1="5" x2="31" y2="38" gradientUnits="userSpaceOnUse">
			<stop stop-color="#FFF3D1"/>
			<stop offset="0.3" stop-color="#F2C84B"/>
			<stop offset="0.7" stop-color="#D4AF37"/>
			<stop offset="1" stop-color="#996515"/>
		</linearGradient>
	</defs>
</svg>
