<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR8V Stacks — 3D Tetris Hero System (Backup Step 2 Before Shape Parity Relocation)</title>
  
  <!-- Brand Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Michroma&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Studio-Grade Palette Extracted Directly From Master Prompt */
      --block-obsidian: #141414;      /* OpenAI, Shopify, Claude */
      --block-royal-blue: #0D52E0;    /* Custom Development, Next.js, AI MVP */
      --block-light-grey: #E5E4DE;    /* Web Design, WordPress */
      --block-purple: #5C32BD;        /* Structural Tetris Step/L Filler */
      --block-terracotta: #E85A1C;    /* Elementor */
      --block-golden-yellow: #EAB308;/* Structural Tetris Step/L Filler */
      --block-forest-green: #1E7D34;  /* Figma */
      --block-lime-green: #6E9C26;    /* Structural Tetris Step/L Filler */
      --block-sand-beige: #D9C5A0;    /* Content Writing */
      
      --c8-blue: #0047E1;
      --c8-ink: #080808;
      --c8-sub: #666666;
      
      --font-body: 'DM Sans', sans-serif;
      --font-heading: 'Michroma', sans-serif;
      --font-mono: 'Space Mono', monospace;
      
      --u: 56px;            /* Standardized 1x1 Tetris Module Scale */
      --block-radius: 2px;  /* STRICT 2PX CORNER RADIUS */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FAFAF7;
      color: var(--c8-ink);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Page Header */
    .catalog-header {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
    }

    .catalog-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--c8-blue);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .catalog-h1 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #111111;
    }

    .catalog-desc {
      color: var(--c8-sub);
      font-size: 0.95rem;
      max-width: 840px;
      margin: 0 auto;
    }

    /* Motion Controller Bar */
    .motion-controller {
      max-width: 1240px;
      margin: 0 auto 2rem auto;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 40px;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .state-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: #555;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .state-btn.active {
      background: var(--c8-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(0, 71, 225, 0.3);
    }

    /* Source of Truth Reference Box */
    .reference-box {
      max-width: 1240px;
      margin: 0 auto 2.5rem auto;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .reference-box h2 {
      font-size: 0.8rem;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .reference-img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 2px;
    }

    /* ════════════════════════════════════════════════════════════════
       3D TETRIS PUZZLE ENGINE (INTERLOCKING STEP-AND-SOCKET GEOMETRY)
       ════════════════════════════════════════════════════════════════ */

    .t-piece {
      display: inline-grid;
      position: relative;
      user-select: none;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.16));
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .t-cell {
      width: var(--cw, var(--u, 56px));
      height: var(--ch, var(--u, 56px));
      position: relative;
      box-sizing: border-box;
    }

    .t-shape-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--block-radius, 2px);
      box-shadow: 
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.40),
        inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tone Classes */
    .tone-obsidian { background: var(--block-obsidian); color: #FFFFFF; }
    .tone-royal-blue { background: var(--block-royal-blue); color: #FFFFFF; }
    .tone-light-grey { background: var(--block-light-grey); color: #111111; }
    .tone-light-grey .t-shape-body {
      box-shadow: 
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.85),
        inset -1.5px -1.5px 3px rgba(0, 0, 0, 0.16);
    }
    .tone-purple { background: var(--block-purple); color: #FFFFFF; }
    .tone-terracotta { background: var(--block-terracotta); color: #FFFFFF; }
    .tone-golden-yellow { background: var(--block-golden-yellow); color: #111111; }
    .tone-forest-green { background: var(--block-forest-green); color: #FFFFFF; }
    .tone-lime-green { background: var(--block-lime-green); color: #FFFFFF; }
    .tone-sand-beige { background: var(--block-sand-beige); color: #111111; }

    /* Internal Seam Lines */
    .t-seam-h {
      position: absolute;
      left: 2px; right: 2px; bottom: -1px;
      height: 1px;
      background: rgba(0, 0, 0, 0.16);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.16);
      z-index: 3;
      pointer-events: none;
    }
    .t-seam-v {
      position: absolute;
      top: 2px; bottom: 2px; right: -1px;
      width: 1px;
      background: rgba(0, 0, 0, 0.16);
      box-shadow: 1px 0 0 rgba(255, 255, 255, 0.16);
      z-index: 3;
      pointer-events: none;
    }

    /* Text & Logo Label Overlay */
    .t-label {
      position: absolute;
      z-index: 5;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-transform: uppercase;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .t-cdn-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .t-cdn-logo.is-white {
      filter: brightness(0) invert(1);
    }

    /* Main Hero Arena */
    .hero-arena-section {
      max-width: 1320px;
      margin: 0 auto 4rem auto;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 3rem 1.5rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    .hero-arena-container {
      width: 100%;
      height: 660px;
      background: #FAFAF7;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .hero-content-overlay {
      position: absolute;
      top: 2.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 820px;
      text-align: center;
      z-index: 20;
      padding: 0 1.5rem;
      pointer-events: none;
    }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c8-blue);
      margin-bottom: 0.75rem;
    }

    .hero-h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3.2vw, 2.6rem);
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--c8-ink);
      margin-bottom: 0.85rem;
    }

    .hero-sub {
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: #4A4A4A;
      max-width: 640px;
      margin: 0 auto 1.25rem auto;
      line-height: 1.6;
    }

    .hero-ctas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      pointer-events: auto;
    }

    .btn-primary-c8 {
      background: var(--c8-blue);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary-c8 {
      background: #FFFFFF;
      color: var(--c8-ink);
      border: 1px solid rgba(8, 8, 8, 0.15);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .matrix-floor-wrapper {
      width: 100%;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .matrix-arena {
      display: grid;
      grid-template-columns: repeat(15, var(--u, 56px));
      grid-template-rows: repeat(7, var(--u, 56px));
      gap: 0;
      position: relative;
    }

    .airborne-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .air-wp-purple   { position: absolute; left: 30px;  top: 50px;  transform: rotate(-10deg); }
    .air-nextjs      { position: absolute; left: 15px;  top: 220px; transform: rotate(-16deg); }
    .air-green-z     { position: absolute; right: 100px; top: 40px;  transform: rotate(12deg); }
    .air-amber-l     { position: absolute; right: 30px;  top: 190px; transform: rotate(22deg); }

    .docked-socket {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body.mode-70 .docked-socket {
      opacity: 0;
      transform: translateY(-80px) scale(0.9);
      pointer-events: none;
    }

    body.mode-70 .airborne-layer {
      opacity: 1;
      transform: translateY(0);
    }

    body.mode-100 .airborne-layer {
      opacity: 0;
      transform: translateY(40px);
      pointer-events: none;
    }

    body.mode-100 .docked-socket {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .catalog-grid {
      max-width: 1240px;
      margin: 0 auto 4rem auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
    }

    .piece-card {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .piece-card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .piece-title { font-size: 0.88rem; font-weight: 700; color: #111; }
    .piece-color-tag { font-size: 0.72rem; color: #555; font-weight: 600; background: #F4F4F0; padding: 0.25rem 0.65rem; border-radius: 4px; }
    .piece-stage { width: 100%; height: 220px; background: #F5F5F2; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }

  </style>
</head>
<body class="mode-70">
  <div style="padding: 2rem; text-align: center;">Backup Step 2 File</div>
</body>
</html>
